<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>404 — Destination or Route Not Found | Vizamigo</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="The requested destination or route could not be found on Vizamigo." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background: radial-gradient(circle at 50% 0%, #131c31 0%, #0b0f19 75%);
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        line-height: 1.6;
      }
      .card {
        max-width: 540px;
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        padding: 36px 32px;
        text-align: center;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 9999px;
        background: rgba(255, 107, 107, 0.14);
        border: 1px solid rgba(255, 107, 107, 0.3);
        color: #ff8787;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 18px;
      }
      h1 {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
      }
      p {
        color: #94a3b8;
        font-size: 14px;
        margin-bottom: 24px;
      }
      .lang-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      .lang-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        min-width: 88px;
        padding: 10px 18px;
        border-radius: 9999px;
        background: rgba(42, 140, 130, 0.18);
        border: 1px solid rgba(42, 140, 130, 0.4);
        color: #f8fafc;
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
        transition: all 0.2s ease;
      }
      .lang-btn:hover {
        background: #2a8c82;
        border-color: #52b2a7;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">HTTP 404 · Route Not Found</div>
      <h1>404 — Destination Not Found</h1>
      <p>
        Aradığınız ülke dosyası veya rota bulunamadı. Lütfen aşağıdaki dil kapılarından Vizamigo ana rehberine dönün.<br />
        The requested destination or travel tool URL does not exist.
      </p>
      <nav class="lang-links" aria-label="Localized Home Gateways">
        <a class="lang-btn" href="/tr">🇹🇷 Türkçe</a>
        <a class="lang-btn" href="/en">🇬🇧 English</a>
        <a class="lang-btn" href="/de">🇩🇪 Deutsch</a>
        <a class="lang-btn" href="/ru">🇷🇺 Русский</a>
        <a class="lang-btn" href="/es">🇪🇸 Español</a>
      </nav>
    </main>
  </body>
</html>
