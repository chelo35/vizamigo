# Resmî seyahat uyarılarını (ABD, İngiltere FCDO, Kanada) her ayın 1'inde yeniler.
# Değişiklik varsa redesign/deniz ve main'e commit eder; Vercel main'den otomatik yayınlar.
name: Resmî seyahat uyarıları
on:
  schedule:
    - cron: '55 7 1 * *'   # her ayın 1'i 10:55 (İstanbul)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: advisories
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/deniz
          fetch-depth: 0
      - name: Uyarıları çek
        id: upd
        run: |
          python3 scripts/update-advisories.py | tee /tmp/adv.txt
          if git diff --quiet -- src/data/officialAdvisories.json; then echo "changed=0" >> "$GITHUB_OUTPUT"; else echo "changed=1" >> "$GITHUB_OUTPUT"; fi
      - name: Doğrula
        if: steps.upd.outputs.changed == '1'
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('src/data/officialAdvisories.json'))
          c = d['c']
          for ag in ('us', 'uk', 'ca'):
              n = sum(1 for v in c.values() if ag in v)
              assert n >= 150, f'{ag}: {n}'
              assert all(1 <= v[ag][0] <= 4 for v in c.values() if ag in v)
          print('ok', len(c))
          PY
      - name: Commit ve yayın
        if: steps.upd.outputs.changed == '1'
        run: |
          git config user.name "vizamigo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/officialAdvisories.json
          git commit -m "Resmî seyahat uyarıları güncellendi ($(date -u +%Y-%m-%d))" -m "$(sed -n '1,40p' /tmp/adv.txt)"
          git push origin HEAD:redesign/deniz
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then git push origin HEAD:main; else echo "main ayrışmış; yalnızca redesign/deniz güncellendi" && exit 1; fi
      - name: Özet
        if: always()
        run: |
          echo "### Resmî seyahat uyarıları" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat /tmp/adv.txt >> "$GITHUB_STEP_SUMMARY" || true; echo '```' >> "$GITHUB_STEP_SUMMARY"
