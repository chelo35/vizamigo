    <!-- Instant Theme Init Script (FOUC Prevention) -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('vr_theme');
          const isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch {}
      })();
    </script>

    <!-- Route-Specific Shell Remover & Multilingual Dictionary Sync Script -->
    <script>
      (function() {
        try {
          var p = window.location.pathname.replace(/\/+$/, '') || '/';
          var isHome = p === '/' || /^\/(tr|en|de|es|ru)$/.test(p);
          var shell = document.getElementById('vz-static-hero-shell');
          if (!isHome && shell) {
            shell.remove();
            return;
          }

          var lang = 'tr';
          var pathLang = p.split('/')[1]?.toLowerCase();
          if (['tr','en','de','es','ru'].indexOf(pathLang) !== -1) {
            lang = pathLang;
          } else {
            var stored = localStorage.getItem('vr_lang');
            if (stored && ['tr','en','de','es','ru'].indexOf(stored) !== -1) {
              lang = stored;
            }
          }

          var D = {
            tr: { t: "Valizini hazırla, vizeyi dert etme.", s: "199 ülke vize rehberi, dünya gün sayacı, rota planı ve yerel uygulamalar tek panoda." },
            en: { t: "Pack your bags, forget the visa stress.", s: "199-country visa guide, global day counter, route planner & local apps in one dashboard." },
            de: { t: "Koffer packen, Visum-Stress vergessen.", s: "199 Länder Visaguide, Welt-Tagezähler, Routenplaner und lokale Apps in einem Dashboard." },
            es: { t: "Prepara tu maleta, olvida el estrés del visado.", s: "Guía de 199 países, contador global de días, planificador de rutas y apps locales." },
            ru: { t: "Собирайте чемодан, забудьте о визовом стрессе.", s: "Гид по 199 странам, глобальный счетчик дней, планировщик маршрутов и местные приложения." }
          };

          var item = D[lang] || D.tr;
          var tEl = document.getElementById('vz-shell-title');
          var sEl = document.getElementById('vz-shell-subtitle');
          if (tEl) tEl.textContent = item.t;
          if (sEl) sEl.textContent = item.s;
        } catch(e) {}
      })();
    </script>
